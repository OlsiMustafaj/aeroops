spring:
  application:
    name: aeroops
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aeroops}
    username: ${DB_USER:aeroops}
    password: ${DB_PASSWORD:aeroops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  # Problem details are produced by our own GlobalExceptionHandler; Spring's built-in
  # handler (spring.mvc.problemdetails.enabled) stays off so it can't intercept validation errors.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
